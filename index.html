<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>StudyBot 3000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .lang-select {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-login, .btn-signup, .btn-history {
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
        }
        .btn-login {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-login:hover {
            background: #667eea;
            color: white;
        }
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-signup:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-history {
            background: #28a745;
            color: white;
        }
        .btn-history:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }
        
        /* Main Container */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 50px;
        }
        
        /* Mode Selection */
        .mode-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .mode-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .mode-btn:not(.active) {
            background: white;
            color: #333;
        }
        .mode-btn:hover {
            transform: translateY(-3px);
        }
        
        /* Content Cards */
        .content-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }
        .content-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        /* Quiz Section */
        .quiz-setup {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        select, textarea, button {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        /* Quiz Display */
        #quiz-container {
            margin-top: 20px;
            display: none;
        }
        .quiz-question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .quiz-option {
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quiz-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        /* Homework Section */
        #raspuns {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }
        .error {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 5px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .score-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        /* History Styles */
        .history-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .history-item.quiz {
            border-left-color: #28a745;
        }
        .history-item.homework {
            border-left-color: #667eea;
        }
        .history-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .history-type {
            font-weight: bold;
            color: #667eea;
        }
        .history-content {
            margin-top: 5px;
            color: #333;
        }
        .clear-history {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .clear-history:hover {
            background: #c82333;
        }
        .empty-history {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .history-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        .answer-content {
            line-height: 1.6;
            color: #333;
        }
        .answer-content h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .answer-content ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        .answer-content li {
            margin-bottom: 5px;
        }
        .answer-content strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->

    <!-- Main Container -->

            <button class="mode-btn" onclick="switchMode('quiz')" id="btn-quiz">
                🎮 Quiz Interactiv
            </button>
        </div>

        <!-- Homework Mode -->

                <option value="biologie">🧬 Biologie</option>
                <option value="engleza">🇬🇧 Engleză</option>

Exemple:
• 'Calculează: 2x + 5 = 15'

            <button class="btn-primary" onclick="rezolva()">🔍 Rezolvă</button>

            <div id="raspuns"></div>
        </div>

        <!-- Quiz Mode -->
        <div class="content-card" id="quiz-card">
            <h1 id="quiz-title">🎮 Quiz Interactiv</h1>
            
            <div class="quiz-setup">
                <select id="quiz-materie">
                    <option value="">Selectează materia...</option>
                    <option value="matematica">📐 Matematică</option>
                    <option value="romana">📚 Limba Română</option>
                    <option value="fizica">⚡ Fizică</option>
                    <option value="chimie">🧪 Chimie</option>
                    <option value="istorie">🏛️ Istorie</option>
                    <option value="geografie">🌍 Geografie</option>
                    <option value="biologie">🧬 Biologie</option>
                    <option value="engleza">🇬🇧 Engleză</option>
                </select>
                
                <select id="quiz-clasa">
                    <option value="">Selectează clasa...</option>
                    <option value="5">Clasa a V-a</option>
                    <option value="6">Clasa a VI-a</option>
                    <option value="7">Clasa a VII-a</option>

                    <option value="9">Clasa a IX-a</option>

                </select>
                
                <button class="btn-primary full-width" onclick="startQuiz()">▶️ Începe Quiz-ul</button>
            </div>
            
            <div id="quiz-container"></div>
            <div id="quiz-score" class="score-display" style="display: none;"></div>
        </div>
    </div>

    <!-- Login/Signup Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content" style="position: relative;">
            <span class="close-modal" onclick="closeModal('auth-modal')">&times;</span>
            <h2 id="modal-title">🔐 Log In</h2>
            <input type="email" placeholder="Email" id="email">
            <input type="password" placeholder="Parolă" id="password">
            <button class="btn-primary" onclick="authenticate()" id="auth-btn">Continuă</button>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="history-modal">
        <div class="modal-content" style="position: relative;">
            <span class="close-modal" onclick="closeModal('history-modal')">&times;</span>
            <h2>📚 Istoric Activități</h2>
            
            <div class="history-filters">
                <button class="filter-btn active" onclick="filterHistory('all')">Toate</button>
                <button class="filter-btn" onclick="filterHistory('homework')">Teme</button>
                <button class="filter-btn" onclick="filterHistory('quiz')">Quiz-uri</button>
            </div>
            
            <div id="history-content">

            </div>
            
            <button class="clear-history" onclick="clearHistory()">🗑️ Șterge Istoricul</button>

        function renderHistory() {

            if (currentFilter !== 'all') {
                filteredHistory = activityHistory.filter(item => item.type === currentFilter);

            // Sort by date descending
            filteredHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (filteredHistory.length === 0) {
                container.innerHTML = `<div class="empty-history">${t.emptyHistory}</div>`;
                return;

            let html = '';
            filteredHistory.forEach(item => {

                const typeClass = item.type;

                    { question: currentLang === 'ro' ? 'Câte oase are corpul uman adult?' : 'How many bones does an adult human body have?', options: ['106', '206', '306', '406'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Ce este ADN-ul?' : 'What is DNA?', options: currentLang === 'ro' ? ['Acid care transportă informația genetică', 'Proteină', 'Lipidă', 'Carbohidrat'] : ['Acid that carries genetic information', 'Protein', 'Lipid', 'Carbohydrate'], correct: 0 },
                    { question: currentLang === 'ro' ? 'Care este funcția plămânilor?' : 'What is the function of the lungs?', options: currentLang === 'ro' ? ['Pomparea sângelui', 'Respirația', 'Digestia', 'Filtrarea sângelui'] : ['Pumping blood', 'Breathing', 'Digestion', 'Blood filtration'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Ce regn aparțin bacteriile?' : 'What kingdom do bacteria belong to?', options: ['Monera', 'Protista', 'Fungi', 'Plantae'], correct: 0 }
                ],
                engleza: [
                    { question: currentLang === 'ro' ? 'Care este forma corectă: "He ___ to school every day."' : 'What is the correct form: "He ___ to school every day."', options: ['go', 'goes', 'going', 'went'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Cum se traduce "mereu" în engleză?' : 'How do you translate "mereu" into English?', options: ['never', 'always', 'sometimes', 'rarely'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Care este pluralul lui "child"?' : 'What is the plural of "child"?', options: ['childs', 'children', 'childes', 'childrens'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Ce timp verbal este: "I have eaten"?' : 'What tense is: "I have eaten"?', options: ['Past Simple', 'Present Perfect', 'Past Perfect', 'Present Continuous'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Cum se formează interogativul în Present Simple?' : 'How is the interrogative formed in Present Simple?', options: ['Adding -ing', 'Using do/does', 'Using was/were', 'Adding -ed'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Care este sinonimul lui "happy"?' : 'What is the synonym of "happy"?', options: ['sad', 'angry', 'joyful', 'tired'], correct: 2 },
                    { question: currentLang === 'ro' ? 'Cum se scrie numărul 40 în engleză?' : 'How do you write the number 40 in English?', options: ['fourty', 'forty', 'fourteen', 'four'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Care este forma de comparativ a lui "good"?' : 'What is the comparative form of "good"?', options: ['gooder', 'more good', 'better', 'best'], correct: 2 },
                    { question: currentLang === 'ro' ? 'Ce înseamnă "weather"?' : 'What does "weather" mean?', options: ['Whether', 'Vreme', 'Piele', 'Păun'], correct: 1 },
                    { question: currentLang === 'ro' ? 'Care este articolul nehotărât pentru cuvinte care încep cu o consoană?' : 'What is the indefinite article for words starting with a consonant?', options: ['an', 'a', 'the', '-'], correct: 1 }
                ]
            };
            
            // Shuffle and return 10 questions
            let subjectQuestions = questions[materie] || questions['matematica'];
            return subjectQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
        }

        function showQuestion() {
            const container = document.getElementById('quiz-container');
            const t = translations[currentLang];
            
            if (currentQuestion >= quizQuestions.length) {
                showFinalScore();
                return;
            }
            
            const q = quizQuestions[currentQuestion];
            
            let html = `
                <div class="quiz-question">
                    <div class="progress-bar" style="margin-bottom: 15px;">
                        <div class="progress-fill" style="width: ${((currentQuestion + 1) / quizQuestions.length) * 100}%"></div>
                    </div>
                    <h3>${t.question} ${currentQuestion + 1}/${quizQuestions.length}</h3>
                    <p style="font-size: 18px; margin: 15px 0;">${q.question}</p>
                    <div class="quiz-options">
            `;
            
            q.options.forEach((opt, idx) => {
                html += `<div class="quiz-option" onclick="selectAnswer(${idx})">${opt}</div>`;
            });
            
            html += '</div></div>';
            container.innerHTML = html;
        }

        function selectAnswer(selected) {
            const q = quizQuestions[currentQuestion];
            const options = document.querySelectorAll('.quiz-option');
            const t = translations[currentLang];
            
            options.forEach((opt, idx) => {
                opt.style.pointerEvents = 'none';
                if (idx === q.correct) {
                    opt.classList.add('correct');
                    opt.innerHTML += ' ✅ ' + t.correct;
                } else if (idx === selected && idx !== q.correct) {
                    opt.classList.add('wrong');
                    opt.innerHTML += ' ❌ ' + t.wrong;
                }
            });
            
            if (selected === q.correct) {
                quizScore++;
            }
            
            setTimeout(() => {
                currentQuestion++;
                showQuestion();
            }, 1500);
        }

        function showFinalScore() {
            const container = document.getElementById('quiz-container');
            const scoreDiv = document.getElementById('quiz-score');
            const t = translations[currentLang];
            
            const percentage = Math.round((quizScore / quizQuestions.length) * 100);
            const materie = document.getElementById('quiz-materie').value;
            const clasa = document.getElementById('quiz-clasa').value;
            
            // Save to history
            addToHistory({
                type: 'quiz',
                subject: materie,
                grade: clasa,
                score: quizScore,
                total: quizQuestions.length,
                percentage: percentage
            });
            
            container.innerHTML = '';
            scoreDiv.style.display = 'block';
            scoreDiv.innerHTML = `
                ${t.finalScore}: ${quizScore}/${quizQuestions.length}<br>
                <span style="font-size: 18px;">${percentage}%</span>
                <div class="progress-bar" style="margin-top: 10px;">
                    <div class="progress-fill" style="width: ${percentage}%"></div>
                </div>
            `;
            
            setTimeout(() => {
                alert(t.congratulations + ' ' + percentage + '%');
            }, 500);
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
    </script>
</body>
</html>
