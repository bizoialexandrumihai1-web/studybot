<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>StudyBot 3000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .lang-select {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-login, .btn-signup, .btn-history {
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
        }
        .btn-login {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-login:hover {
            background: #667eea;
            color: white;
        }
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-signup:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-history {
            background: #28a745;
            color: white;
        }
        .btn-history:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }
        
        /* Main Container */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 50px;
        }
        
        /* Mode Selection */
        .mode-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .mode-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .mode-btn:not(.active) {
            background: white;
            color: #333;
        }
        .mode-btn:hover {
            transform: translateY(-3px);
        }
        
        /* Content Cards */
        .content-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }
        .content-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        /* Quiz Section */
        .quiz-setup {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        select, textarea, button {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        /* Quiz Display */
        #quiz-container {
            margin-top: 20px;
            display: none;
        }
        .quiz-question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .quiz-option {
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quiz-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        /* Homework Section */
        #raspuns {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }
        .error {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 5px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .score-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        /* History Styles */
        .history-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .history-item.quiz {
            border-left-color: #28a745;
        }
        .history-item.homework {
            border-left-color: #667eea;
        }
        .history-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .history-type {
            font-weight: bold;
            color: #667eea;
        }
        .history-content {
            margin-top: 5px;
            color: #333;
        }
        .clear-history {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .clear-history:hover {
            background: #c82333;
        }
        .empty-history {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .history-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        .answer-content {
            line-height: 1.8;
            color: #333;
            font-size: 15px;
        }
        .answer-content h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 17px;
        }
        .answer-content .step-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 16px;
            margin: 8px 0;
        }
        .answer-content .step-label {
            font-weight: bold;
            color: #764ba2;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .answer-content .result-box {
            background: linear-gradient(135deg, #e8f4fd, #f0f4ff);
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 14px 18px;
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }
        .answer-content .verify-box {
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 8px;
            color: #155724;
            font-size: 14px;
        }
        .answer-content ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        .answer-content li {
            margin-bottom: 5px;
        }
        .answer-content strong {
            color: #667eea;
        }
        .math-hint {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 13px;
            color: #856404;
        }
    </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>

    <script>
    // ═══════════════════════════════════════════════════════════════════
    //  MATH ENGINE — real computation, no fake templates for matematica
    // ═══════════════════════════════════════════════════════════════════

    const MathEngine = (() => {

        // ── helpers ──────────────────────────────────────────────────
        function roundNice(n, decimals = 10) {
            const f = Math.pow(10, decimals);
            return Math.round(n * f) / f;
        }
        function fmtNum(n) {
            if (!isFinite(n)) return String(n);
            const r = roundNice(n, 8);
            // show as fraction if small enough
            return Number.isInteger(r) ? String(r) : String(r);
        }
        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }
        function toFraction(decimal, maxDenom = 1000) {
            if (Number.isInteger(decimal)) return null;
            for (let d = 2; d <= maxDenom; d++) {
                const n = Math.round(decimal * d);
                if (Math.abs(n / d - decimal) < 1e-9) {
                    const g = gcd(Math.abs(n), d);
                    return `${n/g}/${d/g}`;
                }
            }
            return null;
        }

        // ── normalise Romanian natural-language math ─────────────────
        function normalise(raw) {
            let s = raw.trim().toLowerCase();

            // Romanian word operators
            s = s.replace(/\bori\b/g, '*');
            s = s.replace(/\bînmulțit cu\b/gi, '*');
            s = s.replace(/\binmultit cu\b/gi, '*');
            s = s.replace(/\bînmultit cu\b/gi, '*');
            s = s.replace(/\bîmpărțit la\b/gi, '/');
            s = s.replace(/\bimpartit la\b/gi, '/');
            s = s.replace(/\bimpartit cu\b/gi, '/');
            s = s.replace(/\bîmpărțit cu\b/gi, '/');
            s = s.replace(/\bplus\b/gi, '+');
            s = s.replace(/\bminus\b/gi, '-');
            s = s.replace(/\bla puterea\b/gi, '^');
            s = s.replace(/\bputerea\b/gi, '^');
            s = s.replace(/\bpătrat\b/gi, '^2');
            s = s.replace(/\bcub\b/gi, '^3');

            // percentage: "25% din 80"  →  "25/100*80"
            s = s.replace(/(\d+(?:\.\d+)?)\s*%\s*din\s*(\d+(?:\.\d+)?)/gi, '($1/100*$2)');
            s = s.replace(/(\d+(?:\.\d+)?)\s*%\s*of\s*(\d+(?:\.\d+)?)/gi, '($1/100*$2)');
            // bare "25% din X" already handled; "25%" alone
            s = s.replace(/(\d+(?:\.\d+)?)\s*%/g, '($1/100)');

            // sqrt / radical
            s = s.replace(/√\s*(\d+(?:\.\d+)?)/g, 'Math.sqrt($1)');
            s = s.replace(/sqrt\s*\(([^)]+)\)/gi, 'Math.sqrt($1)');
            s = s.replace(/radical\s*din\s*(\d+(?:\.\d+)?)/gi, 'Math.sqrt($1)');

            // exponent ^ → **
            s = s.replace(/\^/g, '**');

            // implicit multiplication: 2x → 2*x, 3(... → 3*(
            s = s.replace(/(\d)\s*([a-z])/g, '$1*$2');
            s = s.replace(/([a-z])\s*(\d)/g, '$1*$2');
            s = s.replace(/(\d)\s*\(/g, '$1*(');
            s = s.replace(/\)\s*(\d)/g, ')*$1');
            s = s.replace(/\)\s*\(/g, ')*(');

            return s;
        }

        // ── safe eval (numbers only, no assignment) ──────────────────
        function safeEval(expr) {
            // whitelist characters
            if (/[^0-9+\-*/().x ^%\sMath\.sqrtpow]/.test(expr)) return null;
            try {
                // eslint-disable-next-line no-new-func
                const result = Function('"use strict"; return (' + expr + ')')();
                if (typeof result === 'number' && isFinite(result)) return result;
            } catch(e) {}
            return null;
        }

        // ── evaluate a pure numeric expression ───────────────────────
        function evalExpr(raw) {
            const norm = normalise(raw);
            const val = safeEval(norm);
            if (val === null) return null;
            return { value: val, normalized: norm };
        }

        // ── detect equation type and solve ───────────────────────────
        function solveEquation(raw) {
            const s = normalise(raw);
            if (!s.includes('=')) return null;
            const [lhsRaw, rhsRaw] = s.split('=');

            // ── LINEAR  ax + b = c  (one variable, first degree) ────
            const linearMatch = /^([+-]?\s*\d*\.?\d*)\s*\*?\s*x\s*([+-]\s*\d+\.?\d*)?\s*$/.test(lhsRaw.trim());
            if (linearMatch || /x/.test(s)) {
                const result = solveLinear(lhsRaw, rhsRaw);
                if (result) return result;
            }
            return null;
        }

        function solveLinear(lhsRaw, rhsRaw) {
            // Move everything to lhs: lhs - rhs = 0
            // Parse coefficients of x and constant
            // We'll use a numeric approach: evaluate lhs at x=0 (constant) and x=1 (a+b)
            try {
                const lhs = lhsRaw.trim().replace(/x/g, '*1');
                const rhs = rhsRaw.trim();

                // Evaluate constant part: substitute x=0
                const lhsAt0 = Function('"use strict"; let x=0; return (' + lhsRaw.trim() + ')')();
                const lhsAt1 = Function('"use strict"; let x=1; return (' + lhsRaw.trim() + ')')();
                const rhsVal = Function('"use strict"; let x=0; return (' + rhs + ')')();

                const coeff = lhsAt1 - lhsAt0; // coefficient of x
                const constant = lhsAt0;        // constant term on lhs

                if (Math.abs(coeff) < 1e-12) {
                    // No x — it's either always true or contradiction
                    if (Math.abs(constant - rhsVal) < 1e-9) return { type:'identity', info: 'Ecuație identitate (infinit de soluții)' };
                    return { type:'contradiction', info: 'Ecuație fără soluție' };
                }

                const xVal = (rhsVal - constant) / coeff;
                return { type:'linear', x: roundNice(xVal, 8), coeff, constant, rhsVal };
            } catch(e) { return null; }
        }

        // ── quadratic:  ax² + bx + c = 0 ────────────────────────────
        function solveQuadratic(raw) {
            let s = normalise(raw);
            if (!s.includes('=')) return null;

            let [lhsRaw, rhsRaw] = s.split('=');
            // move rhs to lhs
            let expr = `(${lhsRaw}) - (${rhsRaw})`;

            try {
                // Evaluate at x=0,1,2 to extract a,b,c
                const f = x => Function('"use strict"; let x=' + x + '; return (' + expr + ')')();
                const c = f(0);
                const f1 = f(1);
                const f2 = f(2);
                // f(0)=c, f(1)=a+b+c, f(2)=4a+2b+c
                const b = f1 - c - (f2 - f1 - (f1 - c));
                const a = f1 - b - c;

                if (Math.abs(a) < 1e-10) return null; // not quadratic

                const disc = b*b - 4*a*c;
                if (disc < 0) {
                    // complex roots
                    const re = -b/(2*a);
                    const im = Math.sqrt(-disc)/(2*a);
                    return { type:'quadratic', a, b, c, disc,
                        roots: [],
                        complex: [`${fmtNum(roundNice(re,6))} + ${fmtNum(roundNice(Math.abs(im),6))}i`,
                                  `${fmtNum(roundNice(re,6))} - ${fmtNum(roundNice(Math.abs(im),6))}i`]
                    };
                }
                const x1 = (-b + Math.sqrt(disc)) / (2*a);
                const x2 = (-b - Math.sqrt(disc)) / (2*a);
                return { type:'quadratic', a, b, c, disc,
                    roots: [roundNice(x1,8), roundNice(x2,8)],
                    complex: null
                };
            } catch(e) { return null; }
        }

        // ── percentage helpers ────────────────────────────────────────
        function solvePercent(raw) {
            const s = raw.toLowerCase().trim();
            // "25% din 80"  /  "cat este X% din Y"
            const m1 = s.match(/(\d+(?:\.\d+)?)\s*%\s*(?:din|of)\s*(\d+(?:\.\d+)?)/);
            if (m1) {
                const p = parseFloat(m1[1]), whole = parseFloat(m1[2]);
                return { type:'percent_of', p, whole, result: roundNice(p/100*whole, 8) };
            }
            // "ce procent este X din Y"
            const m2 = s.match(/(?:ce procent|what percent|cat la suta)[^\d]*(\d+(?:\.\d+)?)[^\d]+(\d+(?:\.\d+)?)/);
            if (m2) {
                const part = parseFloat(m2[1]), whole = parseFloat(m2[2]);
                return { type:'what_percent', part, whole, result: roundNice(part/whole*100, 8) };
            }
            return null;
        }

        // ── PUBLIC: solve(question) → HTML string ────────────────────
        function solve(question) {
            const q = question.trim();

            // 1. Percentage (before equation check, handles "25% din 80")
            const pct = solvePercent(q);
            if (pct) return renderPercent(pct, q);

            // 2. Equation detection: contains '=' and a variable 'x'
            const hasX = /[xX]/.test(q);
            const hasEq = /=/.test(q);

            if (hasEq && hasX) {
                // try quadratic first (detects x² terms)
                const quad = solveQuadratic(q);
                if (quad && quad.type === 'quadratic') return renderQuadratic(quad, q);
                // then linear — only if no squared term present
                const hasSquared = /x\s*\*\*\s*2|x\s*\^\s*2|x²/i.test(q);
                if (!hasSquared) {
                    const lin = solveLinear(
                        normalise(q).split('=')[0],
                        normalise(q).split('=')[1]
                    );
                    if (lin) return renderLinear(lin, q);
                }
            }

            // 3. Pure arithmetic expression (no =, no x)
            if (!hasEq && !hasX) {
                const ev = evalExpr(q);
                if (ev !== null) return renderArithmetic(ev, q);
            }

            // 4. Expression with = but numeric (e.g., "2+2=?")
            if (hasEq && !hasX) {
                const lhs = q.split('=')[0];
                const ev = evalExpr(lhs.replace(/\?/g,''));
                if (ev !== null) return renderArithmetic(ev, q);
            }

            return null; // not a math problem we can handle
        }

        // ── renderers ────────────────────────────────────────────────

        function renderArithmetic(ev, original) {
            const val = ev.value;
            const nice = roundNice(val, 8);
            const frac = Number.isInteger(nice) ? null : toFraction(nice);

            const steps = buildArithmeticSteps(original, ev.normalized, nice);

            let html = `<h3>🔢 Calcul aritmetic</h3>`;
            html += `<div class="step-box"><div class="step-label">Expresia</div><code>${escHtml(original)}</code></div>`;
            if (steps.length) {
                html += `<div class="step-box"><div class="step-label">Pași de calcul</div>`;
                steps.forEach(s => { html += `<div style="margin:4px 0; padding-left:8px;">▸ ${s}</div>`; });
                html += `</div>`;
            }
            html += `<div class="result-box">Rezultat: ${fmtNum(nice)}`;
            if (frac) html += ` &nbsp;=&nbsp; <span style="font-size:15px;font-weight:normal;">${frac}</span>`;
            html += `</div>`;

            return html;
        }

        function buildArithmeticSteps(original, normalised, result) {
            const steps = [];
            const norm = original.toLowerCase();

            // Romanian natural language hints
            if (/\bori\b/.test(norm)) steps.push(`"ori" → operația de înmulțire (×)`);
            if (/\bînmulțit cu\b|\binmultit cu\b/i.test(norm)) steps.push(`"înmulțit cu" → operația de înmulțire (×)`);
            if (/\bîmpărțit\b|\bimpartit\b/i.test(norm)) steps.push(`"împărțit la/cu" → operația de împărțire (÷)`);
            if (/√|sqrt|radical/i.test(norm)) steps.push(`Radical → se aplică funcția √`);

            // detect sub-expressions
            const clean = normalised.replace(/Math\.sqrt/g,'√').replace(/\*\*/g,'^');
            steps.push(`Expresia normalizată: ${clean}`);
            steps.push(`Rezultat numeric: ${fmtNum(result)}`);
            return steps;
        }

        function renderLinear(lin, original) {
            if (!lin) return null;
            const { type, x, coeff, constant, rhsVal } = lin;
            if (type === 'identity') return `<div class="result-box">⚠️ Ecuație identitate — infinit de soluții</div>`;
            if (type === 'contradiction') return `<div class="result-box">⚠️ Ecuație fără soluție</div>`;

            const xFrac = toFraction(x);
            const display = Number.isInteger(roundNice(x,5)) ? fmtNum(Math.round(x)) : fmtNum(x);

            let html = `<h3>📐 Ecuație de gradul I</h3>`;
            html += `<div class="step-box"><div class="step-label">Ecuația</div><code>${escHtml(original)}</code></div>`;
            html += `<div class="step-box"><div class="step-label">Identificăm coeficienții</div>`;
            html += `Coeficientul lui x: <strong>${fmtNum(coeff)}</strong><br>`;
            html += `Termenul liber (stânga): <strong>${fmtNum(constant)}</strong><br>`;
            html += `Termenul din dreapta: <strong>${fmtNum(rhsVal)}</strong></div>`;
            html += `<div class="step-box"><div class="step-label">Rezolvare</div>`;
            html += `${fmtNum(coeff)} · x = ${fmtNum(rhsVal)} − ${fmtNum(constant)}<br>`;
            html += `${fmtNum(coeff)} · x = ${fmtNum(rhsVal - constant)}<br>`;
            html += `x = ${fmtNum(rhsVal - constant)} ÷ ${fmtNum(coeff)}</div>`;
            html += `<div class="result-box">x = ${display}`;
            if (xFrac && !Number.isInteger(roundNice(x,5))) html += ` &nbsp;=&nbsp; ${xFrac}`;
            html += `</div>`;

            // Verification
            const verif = roundNice(coeff * x + constant, 6);
            const rhsV  = roundNice(rhsVal, 6);
            const ok = Math.abs(verif - rhsV) < 1e-5;
            html += `<div class="verify-box">✅ Verificare: înlocuim x = ${display} → obținem ${fmtNum(roundNice(coeff*x+constant,4))} = ${fmtNum(roundNice(rhsVal,4))} ${ok?'✔️ Corect!':'⚠️ Verificați datele'}</div>`;

            return html;
        }

        function renderQuadratic(q, original) {
            const { a, b, c, disc, roots, complex } = q;
            let html = `<h3>📐 Ecuație de gradul al II-lea</h3>`;
            html += `<div class="step-box"><div class="step-label">Ecuația</div><code>${escHtml(original)}</code></div>`;
            html += `<div class="step-box"><div class="step-label">Forma standard: ax² + bx + c = 0</div>`;
            html += `a = ${fmtNum(roundNice(a,4))}, b = ${fmtNum(roundNice(b,4))}, c = ${fmtNum(roundNice(c,4))}</div>`;
            html += `<div class="step-box"><div class="step-label">Discriminantul</div>`;
            html += `Δ = b² − 4ac = ${fmtNum(roundNice(b*b,4))} − ${fmtNum(roundNice(4*a*c,4))} = <strong>${fmtNum(roundNice(disc,4))}</strong></div>`;

            if (complex) {
                html += `<div class="result-box">Δ < 0 → soluții complexe (imaginare)<br>x₁ = ${complex[0]}<br>x₂ = ${complex[1]}</div>`;
            } else if (roots.length === 2 && Math.abs(roots[0]-roots[1]) < 1e-9) {
                html += `<div class="step-box"><div class="step-label">Rezolvare</div>Δ = 0 → soluție dublă<br>`;
                html += `x₁ = x₂ = −b / (2a) = ${fmtNum(roots[0])}</div>`;
                html += `<div class="result-box">x₁ = x₂ = ${fmtNum(roots[0])}</div>`;
            } else {
                html += `<div class="step-box"><div class="step-label">Rezolvare</div>Δ > 0 → două soluții reale distincte<br>`;
                html += `x₁ = (−b + √Δ) / (2a) = ${fmtNum(roots[0])}<br>`;
                html += `x₂ = (−b − √Δ) / (2a) = ${fmtNum(roots[1])}</div>`;
                html += `<div class="result-box">x₁ = ${fmtNum(roots[0])}&nbsp;&nbsp;|&nbsp;&nbsp;x₂ = ${fmtNum(roots[1])}</div>`;
                // verification
                const v1 = roundNice(a*roots[0]**2 + b*roots[0] + c, 5);
                const v2 = roundNice(a*roots[1]**2 + b*roots[1] + c, 5);
                html += `<div class="verify-box">✅ Verificare: f(x₁)=${fmtNum(v1)} ≈ 0 ${Math.abs(v1)<0.001?'✔️':'⚠️'} &nbsp;|&nbsp; f(x₂)=${fmtNum(v2)} ≈ 0 ${Math.abs(v2)<0.001?'✔️':'⚠️'}</div>`;
            }
            return html;
        }

        function renderPercent(p, original) {
            let html = `<h3>📊 Calcul procente</h3>`;
            html += `<div class="step-box"><div class="step-label">Expresia</div><code>${escHtml(original)}</code></div>`;
            if (p.type === 'percent_of') {
                html += `<div class="step-box"><div class="step-label">Pași</div>`;
                html += `${p.p}% din ${p.whole}<br>= ${p.p}/100 × ${p.whole}<br>= ${fmtNum(p.p/100)} × ${p.whole}</div>`;
                html += `<div class="result-box">Rezultat: ${fmtNum(p.result)}</div>`;
            } else {
                html += `<div class="step-box"><div class="step-label">Pași</div>`;
                html += `(${p.part} ÷ ${p.whole}) × 100</div>`;
                html += `<div class="result-box">Rezultat: ${fmtNum(p.result)}%</div>`;
            }
            return html;
        }

        function escHtml(s) {
            return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
        }

        return { solve };
    })();

                        </div>

                            2. Define the unknown<br>
                            3. Choose the right formula<br>
                            4. Substitute and calculate<br>
                            5. Check the result and units
                        </div>
                       </div>`;
                bodyHtml = fallback;
            }
        } else {
            // ── Other subjects: use static templates ─────────────────
            const tmpl = (simulatedResponses[currentLang] || simulatedResponses.ro)[materie]
                      || (simulatedResponses.ro)[materie]

                ? `<br><em>💡 Sfat: Detaliați problema cu date concrete pentru rezultate mai precise.</em>`
                : `<br><em>💡 Tip: Provide concrete data for more precise results.</em>`;
            bodyHtml = `<div class="answer-content">${header}${tmpl}${footer}</div>`;
        }

        raspunsDiv.innerHTML = bodyHtml;

        addToHistory({ type:'homework', subject:materie, question:intrebare });
    }

    function showQuestion() {
        const container = document.getElementById('quiz-container');
        const t = translations[currentLang];
        if (currentQuestion >= quizQuestions.length) { showFinalScore(); return; }
        const q = quizQuestions[currentQuestion];
        let html = `<div class="quiz-question">
            <div class="progress-bar" style="margin-bottom:15px;">
                <div class="progress-fill" style="width:${((currentQuestion+1)/quizQuestions.length)*100}%"></div>
            </div>
            <h3>${t.question} ${currentQuestion+1}/${quizQuestions.length}</h3>
            <p style="font-size:18px;margin:15px 0;">${q.question}</p>
            <div class="quiz-options">`;
        q.options.forEach((opt,idx) => { html += `<div class="quiz-option" onclick="selectAnswer(${idx})">${opt}</div>`; });
        html += '</div></div>';
        container.innerHTML = html;
    }

    function selectAnswer(selected) {
        const q = quizQuestions[currentQuestion];
        const opts = document.querySelectorAll('.quiz-option');
        const t = translations[currentLang];
        opts.forEach((opt,idx) => {
            opt.style.pointerEvents = 'none';
            if (idx === q.correct) { opt.classList.add('correct'); opt.innerHTML += ' ✅ ' + t.correct; }
            else if (idx === selected && idx !== q.correct) { opt.classList.add('wrong'); opt.innerHTML += ' ❌ ' + t.wrong; }
        });
        if (selected === q.correct) quizScore++;
        setTimeout(() => { currentQuestion++; showQuestion(); }, 1500);
    }

    function showFinalScore() {
        const container = document.getElementById('quiz-container');
        const scoreDiv  = document.getElementById('quiz-score');
        const t = translations[currentLang];
        const pct = Math.round((quizScore/quizQuestions.length)*100);
        const materie = document.getElementById('quiz-materie').value;
        const clasa   = document.getElementById('quiz-clasa').value;
        addToHistory({ type:'quiz', subject:materie, grade:clasa, score:quizScore, total:quizQuestions.length, percentage:pct });
        container.innerHTML = '';
        scoreDiv.style.display = 'block';
        scoreDiv.innerHTML = `${t.finalScore}: ${quizScore}/${quizQuestions.length}<br><span style="font-size:18px;">${pct}%</span><div class="progress-bar" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%"></div></div>`;
        setTimeout(() => { alert(t.congratulations + ' ' + pct + '%'); }, 500);
    }
